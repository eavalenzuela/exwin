<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>
  </defs>

  <!-- Rounded rect background -->
  <rect width="128" height="128" rx="22" ry="22" fill="url(#bg)"/>

  <!-- Game controller body -->
  <g fill="white" opacity="0.95">
    <!-- Left grip -->
    <ellipse cx="38" cy="82" rx="16" ry="20"/>
    <!-- Right grip -->
    <ellipse cx="90" cy="82" rx="16" ry="20"/>
    <!-- Controller body center -->
    <rect x="30" y="46" width="68" height="44" rx="8"/>

    <!-- D-pad vertical bar -->
    <rect x="40" y="62" width="8" height="20" rx="2" fill="#3584e4"/>
    <!-- D-pad horizontal bar -->
    <rect x="34" y="68" width="20" height="8" rx="2" fill="#3584e4"/>

    <!-- Left analog stick -->
    <circle cx="54" cy="84" r="7" fill="#3584e4"/>
    <circle cx="54" cy="84" r="4" fill="#1a5fb4"/>

    <!-- Right analog stick -->
    <circle cx="80" cy="84" r="7" fill="#3584e4"/>
    <circle cx="80" cy="84" r="4" fill="#1a5fb4"/>

    <!-- Face buttons -->
    <!-- A (right) -->
    <circle cx="92" cy="72" r="5" fill="#e01b24"/>
    <!-- B (bottom) -->
    <circle cx="84" cy="64" r="5" fill="#e5a50a"/>
    <!-- X (top) -->
    <circle cx="84" cy="80" r="5" fill="#1c71d8"/>
    <!-- Y (left) -->
    <circle cx="76" cy="72" r="5" fill="#2ec27e"/>

    <!-- Shoulder bumpers -->
    <rect x="28" y="44" width="24" height="6" rx="3"/>
    <rect x="76" y="44" width="24" height="6" rx="3"/>
  </g>
</svg>
