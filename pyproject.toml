[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exwin"
version = "0.5.1"
description = "Offline Windows software/game manager for Linux via Proton/Wine"
requires-python = ">=3.11"
dependencies = [
    "tomli-w>=1.0",  # TOML writing (tomllib read is stdlib)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
exwin = "exwin.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["exwin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=exwin --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["exwin"]
omit = ["exwin/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
]
show_missing = true

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
