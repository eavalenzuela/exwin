[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exwin"
version = "0.2.0"
description = "Offline Windows software/game manager for Linux via Proton/Wine"
requires-python = ">=3.11"
dependencies = [
    "tomli-w>=1.0",  # TOML writing (tomllib read is stdlib)
]

[project.scripts]
exwin = "exwin.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["exwin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
